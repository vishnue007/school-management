<div class="min-h-screen bg-gray-100 flex items-center justify-center p-6">
  <div class="bg-white rounded-2xl shadow-lg w-full max-w-3xl p-8">
    <h2 class="text-3xl font-semibold text-center text-blue-600 mb-6">
      Create Your Account
    </h2>

    <form [formGroup]="registerForm" (ngSubmit)="onSubmit()" class="grid grid-cols-1 md:grid-cols-2 gap-4">
      <!-- Full Name -->
      <div>
        <label for="fullName" class="block text-gray-600 mb-1">Full Name</label>
        <input id="fullName" type="text" formControlName="fullName" class="w-full border rounded-lg p-2 focus:ring-2 focus:ring-blue-400 focus:outline-none" />
      </div>

      <!-- Email -->
      <div>
        <label for="email" class="block text-gray-600 mb-1">Email</label>
        <input id="email" type="email" formControlName="email" class="w-full border rounded-lg p-2 focus:ring-2 focus:ring-blue-400 focus:outline-none" />
      </div>

      <!-- Password -->
      <div>
        <label for="password" class="block text-gray-600 mb-1">Password</label>
        <input id="password" type="password" formControlName="password" class="w-full border rounded-lg p-2 focus:ring-2 focus:ring-blue-400 focus:outline-none" />
      </div>

      <!-- Confirm Password -->
      <div>
        <label for="confirmPassword" class="block text-gray-600 mb-1">Confirm Password</label>
        <input id="confirmPassword" type="password" formControlName="confirmPassword" class="w-full border rounded-lg p-2 focus:ring-2 focus:ring-blue-400 focus:outline-none" />
      </div>

      <!-- Role -->
      <div>
        <label for="role" class="block text-gray-600 mb-1">Role</label>
        <select id="role" formControlName="role" class="w-full border rounded-lg p-2 focus:ring-2 focus:ring-blue-400 focus:outline-none">
          <option value="">Select Role</option>
          <option>Admin</option>
          <option>Teacher</option>
          <option>Student</option>
          <option>Parent</option>
        </select>
      </div>

      <!-- Phone -->
      <div>
        <label for="phone" class="block text-gray-600 mb-1">Phone</label>
        <input id="phone" type="text" formControlName="phone" class="w-full border rounded-lg p-2 focus:ring-2 focus:ring-blue-400 focus:outline-none" />
      </div>

      <!-- School ID -->
      <div>
        <label for="schoolId" class="block text-gray-600 mb-1">School ID</label>
        <input id="schoolId" type="text" formControlName="schoolId" class="w-full border rounded-lg p-2 focus:ring-2 focus:ring-blue-400 focus:outline-none" />
      </div>

      <!-- Profile Picture -->
      <div class="md:col-span-2">
        <label for="profilePicture" class="block text-gray-600 mb-1">Profile Picture</label>
        <input id="profilePicture" type="file" (change)="onFileSelected($event)" class="w-full border rounded-lg p-2 focus:ring-2 focus:ring-blue-400 focus:outline-none" />
      </div>

      <!-- Address -->
      <div class="md:col-span-2">
        <label for="address" class="block text-gray-600 mb-1">Address</label>
        <textarea id="address" formControlName="address" rows="3" class="w-full border rounded-lg p-2 focus:ring-2 focus:ring-blue-400 focus:outline-none"></textarea>
      </div>

      <!-- Class Section -->
      <div class="md:col-span-2">
        <label for="classSection" class="block text-gray-600 mb-1">Class / Section (Students)</label>
        <input id="classSection" type="text" formControlName="classSection" class="w-full border rounded-lg p-2 focus:ring-2 focus:ring-blue-400 focus:outline-none" />
      </div>

      <!-- Submit Button -->
      <div class="md:col-span-2 text-center mt-4">
        <button type="submit" [disabled]="registerForm.invalid"
          class="bg-blue-600 text-white px-6 py-2 rounded-lg hover:bg-blue-700 transition-all duration-200">
          Register
        </button>
      </div>
    </form>
  </div>
</div>
