<div class="min-h-screen bg-gray-100 flex items-center justify-center p-6">
  <div class="bg-white rounded-2xl shadow-lg w-full max-w-md p-8">
    <h2 class="text-3xl font-semibold text-center text-blue-600 mb-6">
      Welcome Back 👋
    </h2>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="space-y-5">
      <!-- Email -->
      <div>
        <label for="loginEmail" class="block text-gray-600 mb-1">Email</label>
        <input
          id="loginEmail"
          type="email"
          formControlName="email"
          placeholder="Enter your email"
          class="w-full border rounded-lg p-2 focus:ring-2 focus:ring-blue-400 focus:outline-none"
        />
      </div>

      <!-- Password -->
      <div>
        <label for="loginPassword" class="block text-gray-600 mb-1">Password</label>
        <input
          id="loginPassword"
          type="password"
          formControlName="password"
          placeholder="Enter your password"
          class="w-full border rounded-lg p-2 focus:ring-2 focus:ring-blue-400 focus:outline-none"
        />
      </div>

      <!-- Remember Me + Forgot Password -->
      <div class="flex justify-between items-center text-sm">
        <label for="rememberMe" class="flex items-center">
          <input id="rememberMe" type="checkbox" formControlName="rememberMe" class="mr-2" />
          Remember me
        </label>
        <a href="#" class="text-blue-500 hover:underline">Forgot Password?</a>
      </div>

      <!-- Submit -->
      <button
        type="submit"
        [disabled]="loginForm.invalid"
        class="w-full bg-blue-600 text-white py-2 rounded-lg hover:bg-blue-700 transition-all duration-200"
      >
        Login
      </button>
    </form>

    <!-- Divider -->
    <div class="text-center text-gray-500 mt-6 text-sm">or</div>

    <!-- Register Link -->
    <div class="text-center mt-2">
      <a routerLink="/register" class="text-blue-600 hover:underline">
        Create an account
      </a>
    </div>
  </div>
</div>
